<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlavorForge</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>🍽️ FlavorForge</h1>

  <!-- ========== ADD RECIPE ========== -->
  <div class="card">
    <h2>🥗 Add Recipe</h2>
    <form hx-post="/add_recipe" hx-target="#add-result" hx-swap="innerHTML">
      <label>Recipe Name</label>
      <input type="text" name="recipe_name" placeholder="e.g. Mushroom Risotto" required>

      <label>Ingredients</label>
      <div id="ingredient-list">
        <div class="ingredient-row">
          <input type="text" name="ingredients[]" placeholder="tomato">
          <button type="button" onclick="this.parentElement.remove()">&times;</button>
        </div>
      </div>
      <button type="button" class="btn btn-add" onclick="addIngredient()">+ Add Ingredient</button>

      <label>Cuisine</label>
      <input type="text" name="cuisine" placeholder="e.g. Italian" required>

      <button type="submit" class="btn btn-primary">Submit Recipe</button>
    </form>
    <div id="add-result" class="result"></div>
  </div>

  <!-- ========== PREDICTIVE MATCH ========== -->
  <div class="card">
    <h2>🔍 Predictive Match</h2>
    <form hx-post="/predictive_match" hx-target="#match-result" hx-swap="innerHTML">
      <label>Ingredients I Have</label>
      <div id="match-ingredient-list">
        <div class="ingredient-row">
          <input type="text" name="ingredients[]" placeholder="tomato">
          <button type="button" onclick="this.parentElement.remove()">&times;</button>
        </div>
      </div>
      <button type="button" class="btn btn-add" onclick="addMatchIngredient()">+ Add Ingredient</button>
      <button type="submit" class="btn btn-primary">Find Recipes</button>
    </form>
    <div id="match-result" class="result"></div>
  </div>

  <!-- ========== CULTURAL FUSION ========== -->
  <div class="card">
    <h2>🌍 Cultural Fusion</h2>
    <form hx-post="/cultural_fusion" hx-target="#fusion-result" hx-swap="innerHTML">
      <label>Cuisine A</label>
      <input type="text" name="cuisine_a" placeholder="e.g. Italian" required>
      <label>Cuisine B</label>
      <input type="text" name="cuisine_b" placeholder="e.g. Indian" required>
      <button type="submit" class="btn btn-primary">Find Fusion</button>
    </form>
    <div id="fusion-result" class="result"></div>
  </div>

  <!-- ========== VIEW ALL RECIPES ========== -->
  <div class="card">
    <h2>📖 All Recipes</h2>
    <button hx-get="/list_recipes" hx-target="#recipes-result" hx-swap="innerHTML" class="btn btn-refresh">
      Refresh List
    </button>
    <div id="recipes-result" class="result"></div>
  </div>

  <script>
    function addIngredient() {
      const list = document.getElementById('ingredient-list');
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = '<input type="text" name="ingredients[]" placeholder="ingredient">' +
        '<button type="button" onclick="this.parentElement.remove()">&times;</button>';
      list.appendChild(row);
    }
    function addMatchIngredient() {
      const list = document.getElementById('match-ingredient-list');
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = '<input type="text" name="ingredients[]" placeholder="ingredient">' +
        '<button type="button" onclick="this.parentElement.remove()">&times;</button>';
      list.appendChild(row);
    }
  </script>
</body>
</html>
