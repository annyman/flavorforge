<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlavorForge</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px; margin: 2rem auto; padding: 0 1rem;
      background: #fafafa; color: #222;
    }
    h1 { border-bottom: 2px solid #e67e22; padding-bottom: .5rem; }
    h2 { margin-top: 2rem; color: #333; }
    .card {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 1.25rem; margin-bottom: 1.5rem;
    }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input[type="text"] {
      width: 100%; padding: .5rem; border: 1px solid #ccc;
      border-radius: 4px; margin-top: .25rem;
    }
    .ingredient-row { display: flex; gap: .5rem; margin-top: .25rem; }
    .ingredient-row input { flex: 1; }
    .ingredient-row button {
      background: #e74c3c; color: #fff; border: none;
      border-radius: 4px; cursor: pointer; padding: 0 .75rem;
    }
    button[type="submit"], #add-ingredient {
      margin-top: 1rem; padding: .5rem 1.25rem; border: none;
      border-radius: 4px; cursor: pointer; font-weight: 600;
    }
    button[type="submit"] { background: #e67e22; color: #fff; }
    #add-ingredient { background: #3498db; color: #fff; }
    .result {
      margin-top: 1rem; padding: .75rem; border: 1px solid #27ae60;
      border-radius: 4px; background: #f0faf0;
    }
    .result li { padding: .25rem 0; }
    .result p { margin: 0; }
    .result table { width: 100%; border-collapse: collapse; }
    .result th, .result td {
      padding: .5rem; border-bottom: 1px solid #ddd; text-align: left;
    }
    .result th { background: #f5f5f5; font-weight: 600; }
    hr { margin: 2rem 0; border: none; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>FlavorForge</h1>

  <!-- ========== ADD RECIPE ========== -->
  <div class="card">
    <h2>Add Recipe</h2>
    <form hx-post="/add_recipe" hx-target="#add-result" hx-swap="innerHTML">
      <label>Recipe Name</label>
      <input type="text" name="recipe_name" placeholder="e.g. Mushroom Risotto" required>

      <label>Ingredients</label>
      <div id="ingredient-list">
        <div class="ingredient-row">
          <input type="text" name="ingredients[]" placeholder="tomato">
          <button type="button" onclick="this.parentElement.remove()">&times;</button>
        </div>
      </div>
      <button type="button" id="add-ingredient" onclick="addIngredient()">+ Add Ingredient</button>

      <label>Cuisine</label>
      <input type="text" name="cuisine" placeholder="e.g. Italian" required>

      <button type="submit">Submit Recipe</button>
    </form>
    <div id="add-result" class="result"></div>
  </div>

  <!-- ========== PREDICTIVE MATCH ========== -->
  <div class="card">
    <h2>Predictive Match</h2>
    <form hx-post="/predictive_match" hx-target="#match-result" hx-swap="innerHTML">
      <label>Ingredients I Have</label>
      <div id="match-ingredient-list">
        <div class="ingredient-row">
          <input type="text" name="ingredients[]" placeholder="tomato">
          <button type="button" onclick="this.parentElement.remove()">&times;</button>
        </div>
      </div>
      <button type="button" id="add-match-ingredient" onclick="addMatchIngredient()">+ Add Ingredient</button>
      <button type="submit">Find Recipes</button>
    </form>
    <div id="match-result" class="result"></div>
  </div>

  <!-- ========== CULTURAL FUSION ========== -->
  <div class="card">
    <h2>Cultural Fusion</h2>
    <form hx-post="/cultural_fusion" hx-target="#fusion-result" hx-swap="innerHTML">
      <label>Cuisine A</label>
      <input type="text" name="cuisine_a" placeholder="e.g. Italian" required>
      <label>Cuisine B</label>
      <input type="text" name="cuisine_b" placeholder="e.g. Indian" required>
      <button type="submit">Find Fusion</button>
    </form>
    <div id="fusion-result" class="result"></div>
  </div>

  <!-- ========== VIEW ALL RECIPES ========== -->
  <div class="card">
    <h2>All Recipes</h2>
    <button hx-get="/list_recipes" hx-target="#recipes-result" hx-swap="innerHTML"
            style="background:#27ae60;color:#fff;border:none;border-radius:4px;padding:.5rem 1.25rem;cursor:pointer;font-weight:600;">
      Refresh List
    </button>
    <div id="recipes-result" class="result"></div>
  </div>

  <script>
    function addIngredient() {
      const list = document.getElementById('ingredient-list');
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = '<input type="text" name="ingredients[]" placeholder="ingredient">' +
        '<button type="button" onclick="this.parentElement.remove()">&times;</button>';
      list.appendChild(row);
    }
    function addMatchIngredient() {
      const list = document.getElementById('match-ingredient-list');
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = '<input type="text" name="ingredients[]" placeholder="ingredient">' +
        '<button type="button" onclick="this.parentElement.remove()">&times;</button>';
      list.appendChild(row);
    }
  </script>
</body>
</html>
